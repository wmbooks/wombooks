<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOMBOOKS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Трюк против кэша Айфона: версия 40 -->
    <link rel="stylesheet" href="style.css?ver=40">
</head>
<body>

    <header class="top-header">
        <h1 class="header-logo"></h1>
    </header>

    <div id="app">
        <!-- СТРАНИЦА 1: ГЛАВНАЯ (ВИТРИНА) -->
        <div id="page-home">
            <div class="search-container">
                <input type="text" class="search-input" id="main-search-input" placeholder="Найти книгу или автора">
                <span class="search-icon">⚲</span>
            </div>

            <div class="category-filters-container">
                <div class="category-filters-row">
                    <button class="filter-btn active-filter" id="filter-recent">Недавно добавленное</button>
                </div>
                <div class="category-filters-row">
                    <button class="filter-btn" id="filter-tropes">Тропы</button>
                    <button class="filter-btn" id="filter-authors">Авторы</button>
                    <button class="filter-btn" id="filter-standalones">Одиночные</button>
                </div>
            </div>

            <div class="books-grid" id="books-grid"></div>

            <div class="disclaimer-container" id="disclaimer-box">
                <div class="disclaimer-icon">!</div>
                <div class="disclaimer-text">
                    <p style="margin-bottom: 6px;">Данное сообщество, как и все материалы в нем, не преследует за собой коммерческой выгоды.</p>
                    <p>Любая публикация материалов без ссылки на телеграм-канал переводчика строго запрещена.</p>
                </div>
            </div>

            <div class="authors-list-container" id="authors-container" style="display: none;"></div>
            
            <!-- ИЗМЕНЕНО: Одиночные теперь сразу обычная сетка, без авторов -->
            <div class="books-grid" id="standalones-container" style="display: none;"></div>
            
            <div id="tropes-container" style="display: none;">
                <div class="tropes-menu" id="tropes-menu"></div>
                <div class="books-grid" id="tropes-books-grid" style="display: none;"></div>
            </div>
        </div>

        <!-- СТРАНИЦА 2: ДЕТАЛИ КНИГИ -->
        <div id="page-book-details" style="display: none;">
            <div class="details-top-bar">
                <button class="back-btn" onclick="closeBook()">← Назад</button>
                <button class="action-btn fav-btn" id="details-fav-btn" onclick="toggleSaveFromDetails()">♡</button>
            </div>
            
            <div class="details-content">
                <div class="details-cover-wrapper">
                    <img src="" alt="" class="details-cover" id="details-cover">
                    <div class="cover-series-badge" id="details-series-num-badge" style="display: none;"></div>
                </div>

                <h2 class="details-title" id="details-title">Название</h2>
                <p class="details-author" id="details-author">Автор</p>
                
                <div class="details-series-wrapper" id="details-series-container"></div>
                
                <div class="details-rating-wrapper">
                    <div class="details-rating-box" id="details-rating-box" onclick="openReviewsListModal()">0.00</div>
                </div>

                <div class="details-tropes" id="details-tropes"></div>
                <div class="details-annotation" id="details-annotation">Аннотация...</div>
                
                <div class="download-section">
                    <button class="round-back-btn" onclick="closeBook()">←</button>
                    <!-- ИЗМЕНЕНО: Убрано .epub -->
                    <button class="download-btn" id="details-download" onclick="downloadBook()">Скачать книгу</button>
                </div>

                <button class="review-btn" onclick="openReviewModal()">Оценить и оставить отзыв</button>
            </div>
        </div>

        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <nav class="bottom-nav" id="bottom-nav">
            <button class="bottom-pill-btn active-pill" id="nav-home">Главная</button>
            <button class="bottom-pill-btn" id="nav-saved">Сохраненное</button>
            <!-- НОВОЕ: Кнопка переключения темы -->
            <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
        </nav>
    </div>

    <div id="review-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 class="modal-title">Оценить книгу</h3>
            <div class="stars-container" id="stars-container">
                <span class="star" data-val="1">★</span>
                <span class="star" data-val="2">★</span>
                <span class="star" data-val="3">★</span>
                <span class="star" data-val="4">★</span>
                <span class="star" data-val="5">★</span>
            </div>
            <textarea id="review-text" class="review-textarea" placeholder="Напишите пару слов о книге... (необязательно)"></textarea>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" onclick="closeReviewModal()">Отмена</button>
                <button class="modal-btn submit-btn" onclick="submitReview()">Отправить</button>
            </div>
        </div>
    </div>

    <div id="reviews-list-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content reviews-list-content">
            <h3 class="modal-title">Отзывы читателей</h3>
            <div id="reviews-list-container"></div>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" onclick="closeReviewsListModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Трюк против кэша Айфона: версия 40 -->
    <script src="app.js?ver=40"></script>
</body>
</html>
