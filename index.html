<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOMBOOKS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        
<!-- Шапка -->
        <header class="header">
            <div class="header-icon">☰</div> 
            <h1 class="logo-title">WOMBOOKS</h1>
            <div class="heart-icon">♡</div>
        </header>
        
        <!-- СТРАНИЦА 1: ГЛАВНАЯ -->
        <div id="page-home" class="page active">
            <section class="banner">
                <h2>
                    <div class="script-text">Wom</div>
                    <div class="serif-text">books</div>
                </h2>
            </section>
            
            <div class="content-block">
                <h3>Добро пожаловать!</h3>
                <p>Здесь скоро будут новинки и рекомендации.</p>
            </div>
        </div>

        <!-- СТРАНИЦА 2: КАТАЛОГ -->
        <div id="page-catalog" class="page" style="display: none;">
            <div class="content-block">
                <h3>Каталог книг</h3>
                <p>Здесь будет список всех доступных книг канала.</p>
                <!-- Сюда мы позже добавим карточки книг -->
            </div>
        </div>

        <!-- СТРАНИЦА 3: ИЗБРАННОЕ -->
        <div id="page-favorites" class="page" style="display: none;">
            <div class="content-block">
                <h3>Моя полка</h3>
                <p>Здесь будут книги, которые вы сохранили.</p>
            </div>
        </div>

        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <nav class="bottom-nav">
            <button id="nav-home" class="nav-btn active-nav">
                <span class="nav-icon">⌂</span>
                <span>Главная</span>
            </button>
            <button id="nav-catalog" class="nav-btn">
                <span class="nav-icon">▦</span>
                <span>Каталог</span>
            </button>
            <button id="nav-favorites" class="nav-btn">
                <span class="nav-icon">♡</span>
                <span>Избранное</span>
            </button>
        </nav>

    </div>

    <!-- Подключаем наш файл с логикой (создадим его на следующем шаге, если еще не создала) -->
    <script src="app.js"></script>
</body>
</html>
