<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOMBOOKS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- СТРАНИЦА 1: ГЛАВНАЯ -->
        <div id="page-home" class="page active">
            
            <!-- Поисковая строка -->
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Найти книгу или автора">
                <span class="search-icon">⚲</span>
            </div>

            <!-- Фильтры категорий (В два ряда) -->
            <div class="category-filters-container">
                <div class="category-filters-row">
                    <button class="filter-btn active-filter">Недавно добавленное</button>
                </div>
                <div class="category-filters-row">
                    <button class="filter-btn">Одиночные</button>
                    <button class="filter-btn">Авторы</button>
                </div>
            </div>

            <!-- Сетка книг (3 в ряд) -->
            <div class="books-grid">
                
                <!-- Карточка 1 -->
                <div class="book-card">
                    <div class="cover-placeholder"></div>
                    <div class="card-info">
                        <h4 class="book-title">Наследник</h4>
                        <p class="book-author">Софи Траверс</p>
                        <div class="card-actions">
                            <button class="action-btn arrow-btn">➔</button>
                            <button class="action-btn fav-btn">♡</button>
                        </div>
                    </div>
                </div>

                <!-- Карточка 2 -->
                <div class="book-card">
                    <div class="cover-placeholder"></div>
                    <div class="card-info">
                        <h4 class="book-title">Забег не по правилам</h4>
                        <p class="book-author">Элси Сильвер</p>
                        <div class="card-actions">
                            <button class="action-btn arrow-btn">➔</button>
                            <button class="action-btn fav-btn">♡</button>
                        </div>
                    </div>
                </div>

                <!-- Карточка 3 -->
                <div class="book-card">
                    <div class="cover-placeholder"></div>
                    <div class="card-info">
                        <h4 class="book-title">Место для любви</h4>
                        <p class="book-author">Крис Эндрюс</p>
                        <div class="card-actions">
                            <button class="action-btn arrow-btn">➔</button>
                            <button class="action-btn fav-btn">♡</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <nav class="bottom-nav">
            <button class="bottom-pill-btn active-pill">Главная</button>
            <button class="bottom-pill-btn">Сохраненное</button>
        </nav>

    </div>

</body>
</html>
