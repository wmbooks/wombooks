<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOMBOOKS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- СТРАНИЦА 1: ГЛАВНАЯ -->
        <div id="page-home" class="page active">
            
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Найти книгу или автора">
                <span class="search-icon">⚲</span>
            </div>

            <div class="category-filters-container">
                <div class="category-filters-row">
                    <button class="filter-btn active-filter">Недавно добавленное</button>
                </div>
                <div class="category-filters-row">
                    <button class="filter-btn">Тропы</button>
                    <button class="filter-btn">Авторы</button>
                </div>
            </div>

            <!-- Сетка книг (ТЕПЕРЬ ОНА ПУСТАЯ, ТАК КАК КАРТОЧКИ ГРУЗЯТСЯ ИЗ ТАБЛИЦЫ) -->
            <div class="books-grid">
            </div>
            
        </div>

        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <nav class="bottom-nav">
            <button class="bottom-pill-btn active-pill">Главная</button>
            <button class="bottom-pill-btn">Сохраненное</button>
        </nav>

    </div>

    <!-- ПОДКЛЮЧАЕМ НАШ ФАЙЛ ЛОГИКИ -->
    <script src="app.js"></script>
</body>
</html>
