<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WOMBOOKS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        
<!-- Шапка с картинкой -->
<header class="header">
    <img src="header-img.png" alt="WOMBOOKS" class="top-image">
</header>

        <!-- СТРАНИЦА 1: ГЛАВНАЯ -->
        <div id="page-home" class="page active">
            
            <!-- Поисковая строка -->
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Найти книгу">
                <span class="search-icon">⚲</span>
            </div>

            <!-- Фильтры категорий -->
            <div class="category-filters">
                <button class="filter-btn active-filter">Все</button>
                <button class="filter-btn">Одиночные</button>
                <button class="filter-btn">Авторы</button>
            </div>

            <!-- Сетка книг (3 в ряд) -->
            <div class="books-grid">
                
                <!-- Карточка 1 -->
                <div class="book-card">
                    <div class="cover-placeholder"></div>
                    <div class="card-info">
                        <h4 class="book-title">Наследник</h4>
                        <p class="book-author">Софи Траверс</p>
                        <div class="card-actions">
                            <button class="action-btn arrow-btn">➔</button>
                            <button class="action-btn fav-btn">♡</button>
                        </div>
                    </div>
                </div>

                <!-- Карточка 2 -->
                <div class="book-card">
                    <div class="cover-placeholder"></div>
                    <div class="card-info">
                        <h4 class="book-title">Забег не по правилам</h4>
                        <p class="book-author">Элси Сильвер</p>
                        <div class="card-actions">
                            <button class="action-btn arrow-btn">➔</button>
                            <button class="action-btn fav-btn">♡</button>
                        </div>
                    </div>
                </div>

                <!-- Карточка 3 -->
                <div class="book-card">
                    <div class="cover-placeholder"></div>
                    <div class="card-info">
                        <h4 class="book-title">Место для любви</h4>
                        <p class="book-author">Крис Эндрюс</p>
                        <div class="card-actions">
                            <button class="action-btn arrow-btn">➔</button>
                            <button class="action-btn fav-btn">♡</button>
                        </div>
                    </div>
                </div>

            </div>



        <!-- СТРАНИЦА 2: КАТАЛОГ -->
        <div id="page-catalog" class="page" style="display: none;">
            <div class="content-block">
                <h3>Каталог книг</h3>
                <p>Здесь будет список всех доступных книг канала.</p>
                <!-- Сюда мы позже добавим карточки книг -->
            </div>
        </div>

        <!-- СТРАНИЦА 3: ИЗБРАННОЕ -->
        <div id="page-favorites" class="page" style="display: none;">
            <div class="content-block">
                <h3>Моя полка</h3>
                <p>Здесь будут книги, которые вы сохранили.</p>
            </div>
        </div>

        <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
        <nav class="bottom-nav">
            <button id="nav-home" class="nav-btn active-nav">
                <span class="nav-icon">⌂</span>
                <span>Главная</span>
            </button>
            <button id="nav-catalog" class="nav-btn">
                <span class="nav-icon">▦</span>
                <span>Каталог</span>
            </button>
            <button id="nav-favorites" class="nav-btn">
                <span class="nav-icon">♡</span>
                <span>Избранное</span>
            </button>
        </nav>

    </div>

    <!-- Подключаем наш файл с логикой (создадим его на следующем шаге, если еще не создала) -->
    <script src="app.js"></script>
</body>
</html>
